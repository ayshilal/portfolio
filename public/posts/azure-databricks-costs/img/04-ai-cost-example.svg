<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="380" fill="#ffffff"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">What a lab week's AI costs typically look like</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#6b7280">Illustrative example, not real data</text>
  <g font-size="13" fill="#1f2937">
    <text x="215" y="105" text-anchor="end">Vector search endpoint</text>
    <rect x="225" y="88" width="420" height="26" fill="#3b6fd8"/>
    <text x="653" y="106">always on</text>
    <text x="215" y="150" text-anchor="end">Agent serving endpoint</text>
    <rect x="225" y="133" width="300" height="26" fill="#5b8def"/>
    <text x="533" y="151">always on</text>
    <text x="215" y="195" text-anchor="end">SQL warehouse</text>
    <rect x="225" y="178" width="130" height="26" fill="#9ca3af"/>
    <text x="363" y="196">while running</text>
    <text x="215" y="240" text-anchor="end">AI functions (batch)</text>
    <rect x="225" y="223" width="40" height="26" fill="#3f9a52"/>
    <text x="273" y="241">per token</text>
    <text x="215" y="285" text-anchor="end">Pay-per-token LLM calls</text>
    <rect x="225" y="268" width="8" height="26" fill="#3f9a52"/>
    <text x="241" y="286">per token, tiny</text>
  </g>
  <line x1="225" y1="78" x2="225" y2="305" stroke="#6b7280"/>
  <text x="400" y="345" text-anchor="middle" font-size="14" fill="#374151">Endpoints that exist all day cost far more than the prompts you send.</text>
  <text x="400" y="365" text-anchor="middle" font-size="14" fill="#374151">Delete them when you stop for the day.</text>
</svg>
