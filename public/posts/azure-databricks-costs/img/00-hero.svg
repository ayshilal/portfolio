<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b33"/>
      <stop offset="1" stop-color="#1c2f57"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fb3d9"/>
    </marker>
  </defs>
  <rect width="1600" height="800" fill="url(#bg)"/>
  <circle cx="1450" cy="120" r="260" fill="#ffffff" opacity="0.03"/>
  <circle cx="160" cy="760" r="220" fill="#ffffff" opacity="0.03"/>

  <text x="90" y="200" font-size="22" font-weight="bold" letter-spacing="4" fill="#f2a65a">AZURE DATABRICKS · COSTS</text>
  <text x="90" y="300" font-size="68" font-weight="bold" fill="#ffffff">Where is my</text>
  <text x="90" y="380" font-size="68" font-weight="bold" fill="#ffffff">Databricks money</text>
  <text x="90" y="460" font-size="68" font-weight="bold" fill="#ffffff">going?</text>
  <text x="90" y="540" font-size="28" fill="#c7d3ea">From one line on your Azure bill</text>
  <text x="90" y="580" font-size="28" fill="#c7d3ea">to a per-service breakdown.</text>
  <rect x="90" y="625" width="120" height="6" rx="3" fill="#f2a65a"/>

  <rect x="880" y="227" width="160" height="443" rx="8" fill="#5b6b8c"/>
  <text x="960" y="455" text-anchor="middle" font-size="40" font-weight="bold" fill="#ffffff">$ ?</text>
  <text x="960" y="712" text-anchor="middle" font-size="20" fill="#c7d3ea">Your Azure bill</text>

  <line x1="1060" y1="448" x2="1215" y2="448" stroke="#9fb3d9" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arr)"/>

  <g>
    <rect x="1240" y="470" width="160" height="200" fill="#4c8bf5"/>
    <rect x="1240" y="378" width="160" height="92" fill="#22b8a7"/>
    <rect x="1240" y="323" width="160" height="55" fill="#f2a65a"/>
    <rect x="1240" y="271" width="160" height="52" fill="#a77bf3"/>
    <rect x="1240" y="239" width="160" height="32" fill="#ef6f6c"/>
    <rect x="1240" y="227" width="160" height="12" fill="#f4d35e"/>
  </g>
  <g font-size="20" fill="#ffffff">
    <text x="1420" y="577">Notebooks</text>
    <text x="1420" y="431">SQL</text>
    <text x="1420" y="357">Genie</text>
    <text x="1420" y="304">Optimization</text>
    <text x="1420" y="266">Jobs</text>
    <text x="1420" y="232" fill="#c7d3ea" font-size="17">Pipelines</text>
  </g>
  <text x="1320" y="712" text-anchor="middle" font-size="20" fill="#c7d3ea">What it's made of</text>
